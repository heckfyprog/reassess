[project]
name = "reassess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "heckfy", email = "mukhinruslan43@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
]

[project.scripts]
reassess = "reassess.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
